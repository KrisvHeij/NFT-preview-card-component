<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./css/style.css" />

    <title>Frontend Mentor | NFT preview card component</title>
  </head>
  <body>
    <main>
      <article class="card">
        <div class="overlay">
          <div class="overlay--hover"></div>
          <img
            class="card__image"
            src="./images/image-equilibrium.jpg"
            alt="Klik hier voor meer informatie over Equilibrium"
          />
        </div>
        <div>
          <h1 class="card__header">Equilibrium #3429</h1>
          <p class="card__description">
            Our Equilibrium collection promotes balance and calm.
          </p>
          <div class="card__subtext">
            <p class="card__price">
              <span class="card__price__icon" aria-hidden="true"
                ><img src="./images/icon-ethereum.svg" alt=""
              /></span>
              0.041 ETH
            </p>
            <p class="card__time">
              <span class="card__time__icon" aria-hidden="true"
                ><img src="./images/icon-clock.svg" alt="" /></span
              >3 days left
            </p>
          </div>
          <div class="card__footer">
            <img
              class="card__footer__image"
              src="./images/image-avatar.png"
              alt=""
            />
            <p>
              Creation of
              <span class="card__footer__creator">Jules Wyvern</span>
            </p>
          </div>
        </div>
      </article>
    </main>
  </body>
</html>
